name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: self-hosted
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4  
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - 
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: jkaltenbach/python-app:${{ env.SHORT_SHA }}
    outputs:
      commit-id: ${{ env.SHORT_SHA }}
  cd:
    needs: ci
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4  
      - name: Modify Values File
        shell: bash
        run: |
          echo ${{ needs.ci.outputs.commit-id }}
          curl -fsSL -o yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x yq
          ./yq -i '.image.tag = "${{ needs.ci.outputs.commit-id }}"' charts/python-app/values.yaml
      - name: Commit Changes
        uses: Endbug/add-and-commit@v11
        with:
          message: 'Updated values.yaml tag with commit ID:${{ needs.ci.outputs.commit-id }}'
      - name: Setup ArgoCD CLI
        shell: bash
        run: |
          curl -fksSL -o argocd http://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd
      - name: ArgoCD App Sync
        shell: bash
        run : |
          argocd login argocd-server.argocd \
            --plaintext \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app --plaintext --grpc-web